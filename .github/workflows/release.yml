name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build_package:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout code
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Set up Python
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
      with:
        enable-cache: false

    - name: Check tag matches version files
      shell: bash
      run: |
        TAG_VERSION="${GITHUB_REF##*/}"
        TAG_VERSION_NO_PREFIX="${TAG_VERSION#v}"
        PYPROJECT_VERSION=$(grep '^version =' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
        INIT_VERSION=$(grep '^__version__ =' pythonanywhere_core/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')
        echo "Tag: $TAG_VERSION_NO_PREFIX; pyproject: $PYPROJECT_VERSION; module: $INIT_VERSION"
        test "$TAG_VERSION_NO_PREFIX" = "$PYPROJECT_VERSION"
        test "$TAG_VERSION_NO_PREFIX" = "$INIT_VERSION"

    - name: Build package
      run: uv build

    - name: Upload Python artifacts
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: python-dist
        path: dist/

    - name: Publish to PyPI
      if: ${{ !env.ACT }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}

  deploy_docs:
    runs-on: ubuntu-latest
    needs: build_package
    steps:
    - name: Checkout code
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Set up Python
      uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
      with:
        enable-cache: false

    - name: Install docs dependencies
      run: uv sync --locked --extra docs

    - name: Build Sphinx documentation
      run: cd docs && uv run --locked --extra docs sphinx-build -b html . _build

    - name: Setup SSH key
      if: ${{ !env.ACT }}
      uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
      with:
        ssh-private-key: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}

    - name: Add server to known hosts
      if: ${{ !env.ACT }}
      run: ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts

    - name: Deploy to PythonAnywhere
      if: ${{ !env.ACT }}
      run: rsync -av --delete docs/_build/ core@ssh.pythonanywhere.com:/home/core/docs/

  create_release:
    if: ${{ vars.LOCAL_CI != 'true' }}
    runs-on: ubuntu-latest
    needs: build_package
    steps:
    - name: Download Python artifacts
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: python-dist
        path: dist/

    - name: Create Release
      uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
