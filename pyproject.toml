[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonanywhere-core"
version = "0.3.4"
description = "API wrapper for programmatic management of PythonAnywhere services."
authors = [{name = "PythonAnywhere", email = "developers@pythonanywhere.com"}]
license = "MIT"
readme = "README.rst"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
keywords = ["pythonanywhere", "api", "cloud", "web hosting"]
dependencies = [
    "python-dateutil>=2.9.0.post0,<3.0.0",
    "requests>=2.34.2,<3.0.0",
    "typing_extensions>=4.16.0,<5.0.0",
]

[project.urls]
Homepage = "https://core.pythonanywhere.com/"
Documentation = "https://core.pythonanywhere.com/"
Repository = "https://github.com/pythonanywhere/pythonanywhere-core"

[project.optional-dependencies]
test = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pytest-mock>=3.17.0,<4.0.0",
    "responses>=0.26.3,<0.27.0",
]
docs = [
    "sphinx>=8.1.3,<9.0.0",
    "sphinx-rtd-theme>=3.1.0,<4.0.0",
]

[tool.setuptools]
packages = ["pythonanywhere_core"]

[tool.black]
line-length = 120

[tool.pyright]
venvPath = "."
venv = ".venv"
