[tool.poetry]
name = "pythonanywhere-core"
version = "0.3.4"
description = "API wrapper for programmatic management of PythonAnywhere services."
authors = ["PythonAnywhere <developers@pythonanywhere.com>"]
license = "MIT"
readme = "README.rst"
homepage = "https://core.pythonanywhere.com/"
documentation = "https://core.pythonanywhere.com/"
repository = "https://github.com/pythonanywhere/pythonanywhere-core"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.10",
]
keywords = ["pythonanywhere", "api", "cloud", "web hosting"]

[tool.poetry.dependencies]
python = "^3.10"
python-dateutil = "^2.9.0.post0"
requests = "^2.34.2"
typing_extensions = "^4.16.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
pytest-mock = "^3.17.0"
responses = "^0.26.3"
sphinx = "^8.1.3"
sphinx-rtd-theme = "^3.1.0"

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
venvPath = "."
venv = ".venv"
